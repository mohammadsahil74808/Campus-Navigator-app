name: campus_prototype
description: "Campus Navigator — ARCore-powered indoor navigation for college campuses."
publish_to: "none"

version: 2.0.0+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ────────────────────────────────────────────────────────
  provider: ^6.1.2

  # ── Maps & Location ─────────────────────────────────────────────────────────
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.4
  location: ^8.0.1
  latlong2: ^0.9.1

  # ── Camera & AR ─────────────────────────────────────────────────────────────
  # camera 0.11.x: Required for CameraImage stream + proper NV21 support
  camera: ^0.11.0+2
  permission_handler: ^11.3.0

  # ── Indoor Localization ──────────────────────────────────────────────────────
  # MLKit text recognition: room sign OCR
  google_mlkit_text_recognition: ^0.14.0

  # ── Sensors ─────────────────────────────────────────────────────────────────
  sensors_plus: ^6.1.1
  flutter_compass: ^0.7.0
  vector_math: ^2.1.4

  # ── Firebase ─────────────────────────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.4

  # ── UI & Styling ─────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  animations: ^2.0.11
  lottie: ^3.1.3
  animated_text_kit: ^4.2.2
  font_awesome_flutter: ^10.7.0
  cupertino_icons: ^1.0.8

  # ── Utilities ────────────────────────────────────────────────────────────────
  http: ^1.2.2
  url_launcher: ^6.3.1
  flutter_tts: ^3.8.5
  hive_flutter: ^1.1.0
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/my_icon.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/map_dark.json
    - assets/logo.png
    - assets/my_icon.png
